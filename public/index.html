<!DOCTYPE html>
<html lang="de" class="dark">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Disaster Management – Schüttelstraße 79 & 81</title>
  <meta name="description"
    content="Echtzeit-Gefahrenwarnsystem für die Gründerzeithäuser Schüttelstraße 79 und 81 in Wien." />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            slate: { 950: '#0b0f1a' },
          },
          animation: {
            'pulse-slow': 'pulse 3s cubic-bezier(0.4,0,0.6,1) infinite',
          },
        },
      },
    };
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    body {
      font-family: 'Inter', sans-serif;
    }

    .card-glow-green {
      box-shadow: 0 0 24px -4px rgba(34, 197, 94, .35);
    }

    .card-glow-yellow {
      box-shadow: 0 0 24px -4px rgba(234, 179, 8, .35);
    }

    .card-glow-red {
      box-shadow: 0 0 24px -4px rgba(239, 68, 68, .45);
    }

    .card-glow-unknown {
      box-shadow: 0 0 24px -4px rgba(100, 116, 139, .25);
    }

    .badge-green {
      background: rgba(34, 197, 94, .15);
      color: #4ade80;
      border-color: rgba(34, 197, 94, .3);
    }

    .badge-yellow {
      background: rgba(234, 179, 8, .15);
      color: #facc15;
      border-color: rgba(234, 179, 8, .3);
    }

    .badge-red {
      background: rgba(239, 68, 68, .15);
      color: #f87171;
      border-color: rgba(239, 68, 68, .3);
    }

    .badge-unknown {
      background: rgba(100, 116, 139, .15);
      color: #94a3b8;
      border-color: rgba(100, 116, 139, .3);
    }

    .dot-green {
      background: #22c55e;
    }

    .dot-yellow {
      background: #eab308;
    }

    .dot-red {
      background: #ef4444;
    }

    .dot-unknown {
      background: #64748b;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(12px)
      }

      to {
        opacity: 1;
        transform: translateY(0)
      }
    }

    .fade-in {
      animation: fadeIn .45s ease both;
    }

    .fade-in-2 {
      animation: fadeIn .45s .12s ease both;
    }

    .fade-in-3 {
      animation: fadeIn .45s .24s ease both;
    }
  </style>
</head>

<body class="bg-slate-950 text-slate-100 min-h-screen">

  <!-- ── Header ────────────────────────────────────────────────────────── -->
  <header class="border-b border-slate-800 bg-slate-900/60 backdrop-blur sticky top-0 z-10">
    <div class="max-w-5xl mx-auto px-4 py-4 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <span class="text-2xl">🏛️</span>
        <div>
          <h1 class="text-lg font-semibold leading-none whitespace-nowrap">Schüttelstraße 79 &amp; 81</h1>
          <p class="text-xs text-slate-400 mt-0.5">1020 Wien -<br />Vorbeugender Katastrophenschutz</p>
        </div>
      </div>
      <div id="lastUpdate" class="text-xs text-slate-500 text-right hidden sm:block"></div>
    </div>
  </header>

  <!-- ── Main ──────────────────────────────────────────────────────────── -->
  <main class="max-w-5xl mx-auto px-4 py-8 space-y-8">

    <!-- Overall status banner -->
    <section id="overallBanner" class="fade-in rounded-2xl border p-6 transition-all duration-700">
      <div class="flex items-center gap-4">
        <div id="overallDot" class="w-5 h-5 rounded-full animate-pulse-slow shrink-0"></div>
        <div>
          <p class="text-sm font-medium text-slate-400 uppercase tracking-widest">Gesamtstatus</p>
          <p id="overallText" class="text-2xl font-bold mt-0.5"></p>
        </div>
        <div id="overallBadge" class="ml-auto px-3 py-1.5 rounded-full border text-sm font-semibold"></div>
      </div>
    </section>

    <!-- Hazard cards grid -->
    <section class="fade-in-2">
      <h2 class="text-sm font-semibold uppercase tracking-widest text-slate-500 mb-4">Gefahren­indikatoren</h2>
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4" id="hazardGrid">
        <!-- injected by JS -->
      </div>
    </section>

    <!-- Data source + info -->
    <section class="fade-in-3 rounded-xl border border-slate-800 bg-slate-900/40 p-5 text-sm text-slate-400 space-y-1">
      <p id="dataSource"></p>
      <p class="text-xs text-slate-600">Daten werden alle 5 Minuten via GitHub Actions aktualisiert.</p>
      <p id="errorMsg" class="text-red-400 hidden"></p>
    </section>
  </main>

  <!-- ── Script ─────────────────────────────────────────────────────────── -->
  <script>
    const LABELS = {
      heat: { icon: '🌡️', title: 'Extreme Hitze', sub: 'Gefahr für Bausubstanz & Dachgeschoss' },
      wind: { icon: '💨', title: 'Sturm / Windböen', sub: 'Gefahr für Dach & Fassade' },
      rain: { icon: '🌧️', title: 'Starkregen', sub: 'Risiko: Kanalrückstau im Keller' },
      flood: { icon: '🌊', title: 'Hochwasser', sub: 'Pegel Donaukanal / Schwedenbrücke (danubealert.com)' },
      radiation: { icon: '☢️', title: 'Radioaktivität', sub: 'Station AT2002 Wien-Radetzkystraße (Strahlenschutz.gv.at)' },
    };

    const LEVEL_TEXT = { green: 'Alles im grünen Bereich', yellow: 'Erhöhte Wachsamkeit empfohlen', red: 'Sofortige Maßnahmen erforderlich!', unknown: 'Daten werden geladen …' };
    const LEVEL_LABEL = { green: 'SICHER', yellow: 'WARNUNG', red: 'ALARM', unknown: 'UNBEKANNT' };

    let lastFetchedData = null;
    let isFetching = false;

    function applyLevel(el, level, part) {
      if (!el) return;
      el.classList.remove(...['green', 'yellow', 'red', 'unknown'].map(l => `${part}-${l}`));
      el.classList.add(`${part}-${level}`);
    }

    function formatValue(key, hazard) {
      if (!hazard || hazard.value == null) {
        if (key === 'flood') return `Pegel: ${hazard?.pegelCm ?? '?'} cm`;
        return '— Kein Messwert —';
      }
      return `${hazard.value} ${hazard.unit}`;
    }

    function renderHazardCard(key, hazard) {
      const { icon, title, sub } = LABELS[key];
      const level = hazard?.level ?? 'unknown';
      const value = formatValue(key, hazard);

      let thresholdHtml = '';
      if (hazard?.thresholds) {
        const t = hazard.thresholds;
        thresholdHtml = `<p class="text-xs text-slate-500 mt-2 italic">Schwellenwerte: <span class="text-yellow-500">${t.yellow}</span> / <span class="text-red-500">${t.red}</span> ${hazard.unit}</p>`;
      }

      return `
        <div class="rounded-2xl border border-slate-800 bg-slate-900/60 p-5 card-glow-${level} transition-all duration-1000">
          <div class="flex items-start justify-between gap-3">
            <div class="flex items-center gap-3">
              <span class="text-2xl">${icon}</span>
              <div>
                <p class="font-semibold text-slate-100">${title}</p>
                <p class="text-xs text-slate-500">${sub}</p>
              </div>
            </div>
            <span class="badge-${level} shrink-0 px-2.5 py-1 rounded-full border text-xs font-bold transition-colors duration-500">${LEVEL_LABEL[level]}</span>
          </div>
          <p class="mt-4 text-3xl font-bold tabular-nums tracking-tight text-slate-100">${value}</p>
          ${thresholdHtml}
        </div>`;
    }

    function updateRelativeTime() {
      if (!lastFetchedData || !lastFetchedData.fetchedAt) return;
      const lastUpdateEl = document.getElementById('lastUpdate');
      const d = new Date(lastFetchedData.fetchedAt);
      const diffMs = Date.now() - d.getTime();
      const diffSec = Math.floor(diffMs / 1000);
      const diffMin = Math.floor(diffSec / 60);

      let timeStr = 'Gerade eben';
      if (diffMin > 0) {
        timeStr = `vor ${diffMin} Min.`;
      } else if (diffSec > 10) {
        timeStr = `vor ${diffSec} Sek.`;
      }

      const exactTime = d.toLocaleTimeString('de-AT', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
      lastUpdateEl.innerHTML = `<span class="opacity-60">Zuletzt aktualisiert:</span> <span class="font-medium text-slate-300 ml-1">${exactTime}</span> <span class="text-[10px] ml-1 bg-slate-800 px-1.5 py-0.5 rounded text-slate-400 font-mono">${timeStr}</span>`;
      lastUpdateEl.classList.remove('hidden');

      // Warning if data is older than 8 minutes (should be 5 min)
      const warningEl = document.getElementById('errorMsg');
      if (diffMin >= 8) {
        warningEl.textContent = `⚠️ Hinweis: Die Daten sind bereits ${diffMin} Minuten alt. Möglicherweise verzögert sich die Aktualisierung.`;
        warningEl.classList.remove('hidden');
      } else if (!lastFetchedData.error) {
        warningEl.classList.add('hidden');
      }
    }

    async function loadStatus() {
      if (isFetching && lastFetchedData) return;
      isFetching = true;

      // Pulse the update time to show activity
      const lastUpdateEl = document.getElementById('lastUpdate');
      lastUpdateEl.classList.add('animate-pulse');

      const DATA_URL = './alert_status.json';
      try {
        // Advanced cache busting: timestamp + random string
        const cacheBuster = `${Date.now()}-${Math.random().toString(36).substring(7)}`;
        const res = await fetch(`${DATA_URL}?cb=${cacheBuster}`, { cache: 'no-store' });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        lastFetchedData = data;

        // Overall banner
        const overall = data.overall ?? 'unknown';
        const banner = document.getElementById('overallBanner');
        applyLevel(banner, overall, 'card-glow');
        applyLevel(document.getElementById('overallDot'), overall, 'dot');
        applyLevel(document.getElementById('overallBadge'), overall, 'badge');
        document.getElementById('overallText').textContent = LEVEL_TEXT[overall] ?? overall;
        document.getElementById('overallBadge').textContent = LEVEL_LABEL[overall] ?? overall;

        // Hazard cards
        const grid = document.getElementById('hazardGrid');
        grid.innerHTML = Object.entries(LABELS)
          .map(([key]) => renderHazardCard(key, data.hazards?.[key]))
          .join('');

        // Data source
        document.getElementById('dataSource').textContent =
          `Datenquelle: ${data.dataSource ?? 'Unbekannt'} · Standort: ${data.location?.address ?? ''}`;

        // Error handling
        const errEl = document.getElementById('errorMsg');
        if (data.error) {
          errEl.textContent = `⚠️ Fehler beim letzten Datenabruf: ${data.error}`;
          errEl.classList.remove('hidden');
        } else {
          errEl.classList.add('hidden');
        }

        updateRelativeTime();
      } catch (err) {
        console.error('Dashboard load error:', err);
        const errEl = document.getElementById('errorMsg');
        errEl.textContent = `Verbindungsfehler: ${err.message}`;
        errEl.classList.remove('hidden');
      } finally {
        isFetching = false;
        lastUpdateEl.classList.remove('animate-pulse');
      }
    }

    // Initialize
    loadStatus();

    // Aggressive polling: Every 60 seconds (down from 5 min)
    setInterval(loadStatus, 60 * 1000);

    // Relative time update: Every 5 seconds
    setInterval(updateRelativeTime, 5000);

    // Visibility listener: Refresh immediately when tab becomes active
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') {
        loadStatus();
      }
    });
  </script>
</body>

</html>
