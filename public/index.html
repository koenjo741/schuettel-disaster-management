<!DOCTYPE html>
<html lang="de" class="dark">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Disaster Management – Schüttelstraße 79 & 81</title>
  <meta name="description"
    content="Echtzeit-Gefahrenwarnsystem für die Gründerzeithäuser Schüttelstraße 79 und 81 in Wien." />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#0f172a" />
  <link rel="apple-touch-icon" href="/favicon.png" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            slate: { 950: '#0b0f1a' },
          },
          animation: {
            'pulse-slow': 'pulse 3s cubic-bezier(0.4,0,0.6,1) infinite',
          },
        },
      },
    };
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    body {
      font-family: 'Inter', sans-serif;
    }

    .card-glow-green {
      box-shadow: 0 0 24px -4px rgba(34, 197, 94, .35);
    }

    .card-glow-yellow {
      box-shadow: 0 0 24px -4px rgba(234, 179, 8, .35);
    }

    .card-glow-red {
      box-shadow: 0 0 24px -4px rgba(239, 68, 68, .45);
    }

    .card-glow-unknown {
      box-shadow: 0 0 24px -4px rgba(100, 116, 139, .25);
    }

    .badge-green {
      background: rgba(34, 197, 94, .15);
      color: #4ade80;
      border-color: rgba(34, 197, 94, .3);
    }

    .badge-yellow {
      background: rgba(234, 179, 8, .15);
      color: #facc15;
      border-color: rgba(234, 179, 8, .3);
    }

    .badge-red {
      background: rgba(239, 68, 68, .15);
      color: #f87171;
      border-color: rgba(239, 68, 68, .3);
    }

    .badge-unknown {
      background: rgba(100, 116, 139, .15);
      color: #94a3b8;
      border-color: rgba(100, 116, 139, .3);
    }

    .dot-green {
      background: #22c55e;
    }

    .dot-yellow {
      background: #eab308;
    }

    .dot-red {
      background: #ef4444;
    }

    .dot-unknown {
      background: #64748b;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(12px)
      }

      to {
        opacity: 1;
        transform: translateY(0)
      }
    }

    .fade-in {
      animation: fadeIn .45s ease both;
    }

    .fade-in-2 {
      animation: fadeIn .45s .12s ease both;
    }

    .fade-in-3 {
      animation: fadeIn .45s .24s ease both;
    }
  </style>
</head>

<body class="bg-slate-950 text-slate-100 min-h-screen">

  <!-- ── Header ────────────────────────────────────────────────────────── -->
  <header class="border-b border-slate-800 bg-slate-900/60 backdrop-blur sticky top-0 z-10">
    <div class="max-w-[1600px] mx-auto px-4 py-4 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <span class="text-2xl">🏛️</span>
        <div>
          <h1 class="text-lg font-semibold leading-none whitespace-nowrap">Schüttelstraße 79 &amp; 81</h1>
          <p class="text-xs text-slate-400 mt-0.5">1020 Wien -<br />Vorbeugender Katastrophenschutz</p>
        </div>
      </div>
      <div id="lastUpdate" class="text-xs text-slate-500 text-right hidden sm:block"></div>
      <button id="installBtn"
        class="hidden ml-4 px-3 py-1.5 bg-cyan-600 hover:bg-cyan-500 text-white text-xs font-bold rounded-full transition-all flex items-center gap-1.5 shadow-lg shadow-cyan-900/20">
        <span>📲 App installieren</span>
      </button>
    </div>
  </header>

  <!-- ── Main ──────────────────────────────────────────────────────────── -->
  <main class="max-w-[1600px] mx-auto px-4 py-8 space-y-8">

    <!-- Overall status banner -->
    <section id="overallBanner" class="fade-in rounded-2xl border p-6 transition-all duration-700">
      <div class="flex items-center gap-4">
        <div id="overallDot" class="w-5 h-5 rounded-full animate-pulse-slow shrink-0"></div>
        <div>
          <p class="text-sm font-medium text-slate-400 uppercase tracking-widest">Gesamtstatus</p>
          <p id="overallText" class="text-2xl font-bold mt-0.5"></p>
        </div>
        <div id="overallBadge" class="ml-auto px-3 py-1.5 rounded-full border text-sm font-semibold"></div>
      </div>
    </section>

    <!-- Hazard cards grid -->
    <section class="fade-in-2">
      <h2 class="text-sm font-semibold uppercase tracking-widest text-slate-500 mb-4">Gefahren­indikatoren</h2>
      <div class="grid grid-cols-1 lg:grid-cols-2 xl:grid-cols-3 2xl:grid-cols-4 gap-4 lg:gap-6" id="hazardGrid">
        <!-- injected by JS -->
      </div>
    </section>

    <!-- Data source + info -->
    <section class="fade-in-3 rounded-xl border border-slate-800 bg-slate-900/40 p-5 text-sm text-slate-400 space-y-1">
      <p id="dataSource"></p>
      <p class="text-xs text-slate-600">Daten werden bei jedem Seitenaufruf live abgerufen und alle 60 Sekunden
        automatisch aktualisiert.</p>
      <p id="errorMsg" class="text-red-400 hidden"></p>
    </section>
  </main>

  <!-- ── Script ─────────────────────────────────────────────────────────── -->
  <script>
    const LABELS = {
      heat: { icon: '🌡️', title: 'Extreme Hitze', sub: 'Gefahr für Bausubstanz & Dachgeschoss' },
      wind: { icon: '💨', title: 'Sturm / Windböen', sub: 'Gefahr für Dach & Fassade' },
      rain: { icon: '🌧️', title: 'Starkregen', sub: 'Risiko: Kanalrückstau im Keller' },
      flood: { icon: '🌊', title: 'Hochwasser', sub: 'Pegel Donaukanal / Schwedenbrücke' },
      radiation: { icon: '☢️', title: 'Radioaktivität', sub: 'Station AT2002 Wien-Radetzkystraße' },
      airQuality: { icon: '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="28" height="28"><path d="M44 38H20a10 10 0 0 1-1.5-19.9A14 14 0 0 1 44.8 24 8 8 0 0 1 44 38Z" fill="none" stroke="#4ade80" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M38 36c4-3 7-8 7-14a8 8 0 0 0-3-2" fill="none" stroke="#22c55e" stroke-width="3" stroke-linecap="round"/><ellipse cx="40" cy="46" rx="10" ry="6" fill="none" stroke="#22c55e" stroke-width="3" transform="rotate(-35 40 46)"/><path d="M40 46 c-3 3-6 5-10 6" fill="none" stroke="#22c55e" stroke-width="2.5" stroke-linecap="round"/></svg>', title: 'Luftverschmutzung / Feinstaub', sub: 'PM10 Wien-Maximum (MA 22 Luftmessnetz)' },
      earthquake: { icon: '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="28" height="28"><path d="M32 8 8 32h10v20h28V32h10L32 8Z" fill="none" stroke="#EB8345" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M28 52 30 42 26 36 32 24" fill="none" stroke="#EB8345" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M4 38c2-3 4-3 6 0s4 3 6 0" fill="none" stroke="#EB8345" stroke-width="2.5" stroke-linecap="round"/><path d="M48 38c2-3 4-3 6 0s4 3 6 0" fill="none" stroke="#EB8345" stroke-width="2.5" stroke-linecap="round"/></svg>', title: 'Erdbeben', sub: 'Seismische Aktivität im Umkreis 150 km' },
      atAlert: { icon: '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="28" height="28"><circle cx="32" cy="32" r="30" fill="#3BA5B5"/><path d="M32 14 15 46h34Z" fill="none" stroke="#fff" stroke-width="3.5" stroke-linejoin="round"/><line x1="32" y1="25" x2="32" y2="37" stroke="#fff" stroke-width="4" stroke-linecap="round"/><circle cx="32" cy="43" r="2.5" fill="#fff"/></svg>', title: 'Behördliche Warnungen', sub: 'AT-Alert (Cell Broadcast Österreich)' },
      pandemic: { icon: '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="28" height="28"><defs><linearGradient id="virusGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#06b6d4"/><stop offset="100%" stop-color="#8b5cf6"/></linearGradient></defs><path fill="url(#virusGrad)" d="M41.7,32c0,2.1-0.7,4.1-1.8,5.7l5.4,5.4l2.8-2.8c0.8-0.8,2.1-0.8,2.9,0c0.8,0.8,0.8,2.1,0,2.9l-5.7,5.7c-0.8,0.8-2.1,0.8-2.9,0c-0.8-0.8-0.8-2.1,0-2.9l2.8-2.8l-5.4-5.4c-1.6,1.2-3.6,1.9-5.7,1.9v7.6h4c1.1,0,2,0.9,2,2c0,1.1-0.9,2-2,2h-10c-1.1,0-2-0.9-2-2c0-1.1,0.9-2,2-2h4v-7.6c-2.1,0-4.1-0.7-5.7-1.8l-5.4,5.4l2.8,2.8c0.8,0.8,0.8,2.1,0,2.9c-0.8,0.8-2.1,0.8-2.9,0l-5.7-5.7c-0.8-0.8-0.8-2.1,0-2.9l2.8-2.8l5.4-5.4C18.2,36.1,17.5,34.1,17.5,32c0-2.1,0.7-4.1,1.9-5.7l-5.4-5.4l-2.8,2.8c-0.8,0.8-2.1,0.8-2.9,0c-0.8-0.8-0.8-2.1,0-2.9l5.7-5.7c0.8-0.8,2.1-0.8,2.9,0c0.8,0.8,0.8,2.1,0,2.9l-2.8,2.8l5.4,5.4c1.6-1.2,3.6-1.9,5.7-1.9V12h-4c-1.1,0-2-0.9-2-2c0-1.1,0.9-2,2-2h10c1.1,0,2,0.9,2,2c0,1.1-0.9,2-2,2h-4v7.6c2.1,0,4.1,0.7,5.7,1.8l5.4-5.4l-2.8-2.8c-0.8-0.8-0.8-2.1,0-2.9c0.8-0.8,2.1-0.8,2.9,0l5.7,5.7c0.8,0.8,0.8,2.1,0,2.9l-2.8,2.8l-5.4,5.4C40.9,27.9,41.7,29.9,41.7,32z"/><circle cx="30" cy="26" r="4.5" fill="#fff" fill-opacity="0.4"/><circle cx="36" cy="38" r="3" fill="#fff" fill-opacity="0.3"/><circle cx="26" cy="38" r="2" fill="#fff" fill-opacity="0.2"/></svg>', title: 'Infektionsgefahren', sub: 'WHO Disease Outbreak News' },
      fire: { icon: '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="28" height="28"><path d="M32 4c-5 8-12 12-12 24 0 10 8 18 12 18s12-8 12-18c0-12-7-16-12-24Z" fill="#ef4444"/><path d="M32 18c-3 5-7 8-7 14 0 6 5 10 7 10s7-4 7-10c0-6-4-9-7-14Z" fill="#f59e0b"/><path d="M32 28c-1.5 2.5-3 4-3 7 0 3 2.5 5 3 5s3-2 3-5c0-3-1.5-4.5-3-7Z" fill="#fbbf24"/></svg>', title: 'Feuer & Waldbrand', sub: 'Monitoring (GeoSphere & NASA)' },
      space: { icon: '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="28" height="28"><defs><radialGradient id="sunGrad" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#fbbf24"/><stop offset="100%" stop-color="#f59e0b"/></radialGradient></defs><path d="M32 4 C33 12 30 12 32 16 M46 8 C42 15 45 15 48 18 M56 20 C48 22 48 18 52 24 M60 32 C52 33 52 30 56 32 M56 46 C48 42 52 45 49 49 M46 56 C42 48 45 52 38 52 M32 60 C33 52 30 52 32 48 M18 56 C22 48 19 52 15 49 M8 46 C15 42 12 45 15 38 M4 32 C12 33 12 30 8 32 M8 20 C15 18 12 22 15 15 M18 8 C22 15 19 12 24 15" fill="none" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/><circle cx="32" cy="32" r="14" fill="url(#sunGrad)" stroke="#d97706" stroke-width="1"/></svg>', title: 'Weltraumwetter', sub: 'Sonnenaktivität & Erdmagnetfeld' },
      power: { icon: '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="28" height="28"><path d="M38 4 18 36h14l-4 24 20-32H34L38 4Z" fill="#fbbf24" stroke="#d97706" stroke-width="2" stroke-linejoin="round"/></svg>', title: 'Stromversorgung', sub: 'Status Wiener Netze (Echtzeit)' },
      snow: { icon: '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="28" height="28"><path d="M32 8v48M8 32h48M15 15l34 34M49 15L15 49" fill="none" stroke="#60a5fa" stroke-width="3" stroke-linecap="round"/><circle cx="32" cy="32" r="4" fill="#fff" stroke="#60a5fa" stroke-width="1"/></svg>', title: 'Schnee & Winterdienst', sub: 'SNOWGRID & Niederschlagsprognose' },
      ice: { icon: '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="28" height="28"><path d="M32 10v34M24 44h16m-8 0v10" fill="none" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/><circle cx="32" cy="50" r="6" fill="#38bdf8"/><path d="M22 18h20M22 28h20" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/><path d="M32 6c1 12 8 8 12 16c2 4 0 10-4 10s-8-4-8-10" fill="#bae6fd" stroke="#38bdf8" stroke-width="1"/></svg>', title: 'Glatteis-Gefahr', sub: 'Analyse von Reif & gefrierendem Regen' },
      uwz: { icon: '🏛️', title: 'Unwetter­warnungen', sub: 'Status Wien (Gesamt) & Leopoldstadt (Lokal)' }
    };

    const LEVEL_TEXT = { green: 'Alles im grünen Bereich', yellow: 'Erhöhte Wachsamkeit empfohlen', red: 'Sofortige Maßnahmen erforderlich!', unknown: 'Daten werden geladen …' };
    const LEVEL_LABEL = { green: 'SICHER', yellow: 'WARNUNG', red: 'ALARM', unknown: 'UNBEKANNT' };

    let lastFetchedData = null;
    let isFetching = false;

    function applyLevel(el, level, part) {
      if (!el) return;
      el.classList.remove(...['green', 'yellow', 'red', 'unknown'].map(l => `${part}-${l}`));
      el.classList.add(`${part}-${level}`);
    }

    function formatValue(key, hazard) {
      if (!hazard || hazard.value == null) {
        if (key === 'flood') return `Pegel: ${hazard?.pegelCm ?? '?'} cm`;
        return '— Kein Messwert —';
      }
      if (key === 'atAlert' || key === 'pandemic') {
        if (!hazard || !hazard.value) return 'Keine aktiven Meldungen';
        return `${hazard.value} ${hazard.unit}`;
      }
      if (key === 'power') {
        return hazard?.message ?? 'Normalbetrieb';
      }
      if (key === 'snow') {
        return hazard?.condition ?? 'Kein Schnee';
      }
      if (key === 'ice') {
        return hazard?.value ?? 'Sicher';
      }
      if (key === 'uwz') {
        return hazard?.district ?? 'Sicher';
      }
      return `${hazard.value} ${hazard.unit}`;
    }

    function renderHazardCard(key, hazard) {
      const { icon, title, sub } = LABELS[key];
      const level = hazard?.level ?? 'unknown';
      const value = formatValue(key, hazard);

      let thresholdHtml = '';
      const sourceUrl = hazard?.sourceUrl;
      const linkClass = "hover:text-slate-300 transition-colors no-underline";

      if (hazard?.thresholds) {
        const t = hazard.thresholds;
        let innerContent = `Schwellenwerte: <span class="text-yellow-500/80">${t.yellow}</span> / <span class="text-red-500/80">${t.red}</span> ${hazard.unit}`;

        if (key === 'ice') {
          innerContent = `Logik: <span class="text-yellow-500/80">${t.yellow}</span> (Reif/Nässe) / <span class="text-red-500/80">${t.red}</span> (Regen)`;
        }

        thresholdHtml = sourceUrl
          ? `<a href="${sourceUrl}" target="_blank" class="block text-xs text-slate-500 mt-2 italic ${linkClass}">${innerContent}</a>`
          : `<p class="text-xs text-slate-500 mt-2 italic">${innerContent}</p>`;
      }

      let extraHtml = '';
      if (key === 'airQuality' && hazard) {
        const parts = [];
        if (hazard.pm25 != null) parts.push(`PM2.5: ${hazard.pm25} µg/m³`);
        if (hazard.luftIndex != null) {
          const indexLabels = { 1: 'sehr gut', 2: 'gut', 3: 'befriedigend', 4: 'unbefriedigend', 5: 'schlecht', 6: 'sehr schlecht' };
          parts.push(`Luftgüteindex: ${hazard.luftIndex} (${indexLabels[hazard.luftIndex] ?? '?'})`);
        }
        if (parts.length) extraHtml = `<p class="text-xs text-slate-400 mt-1">${parts.join(' · ')}</p>`;
      }
      if (key === 'earthquake' && hazard) {
        const parts = [];
        if (hazard.distanceKm != null) parts.push(`Entfernung: ${hazard.distanceKm} km`);
        if (hazard.depthKm != null) parts.push(`Tiefe: ${hazard.depthKm} km`);
        if (hazard.time) {
          const t = new Date(hazard.time);
          parts.push(`Zeit: ${t.toLocaleString('de-AT', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' })}`);
        }
        if (hazard.eventCount > 1) parts.push(`${hazard.eventCount} Ereignisse (24h)`);
        if (parts.length) extraHtml = `<p class="text-xs text-slate-400 mt-1">${parts.join(' · ')}</p>`;

        if (!thresholdHtml && sourceUrl) {
          thresholdHtml = `<a href="${sourceUrl}" target="_blank" class="block text-xs text-slate-500 mt-2 italic ${linkClass}">Datenquelle: ZAMG/GeoSphere</a>`;
        }
      }
      if (key === 'atAlert' && hazard) {
        if (hazard.title) {
          const parts = [];
          if (hazard.sender) parts.push(`Absender: ${hazard.sender}`);
          if (hazard.expires) {
            const t = new Date(hazard.expires);
            parts.push(`Gültig bis: ${t.toLocaleString('de-AT', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' })}`);
          }
          if (parts.length) extraHtml = `<p class="text-xs text-slate-400 mt-1">${parts.join(' · ')}</p>`;
          if (hazard.description) extraHtml += `<p class="text-xs text-slate-500 mt-1 italic">${hazard.description.slice(0, 120)}${hazard.description.length > 120 ? '…' : ''}</p>`;
        }
        if (sourceUrl) {
          thresholdHtml = `<a href="${sourceUrl}" target="_blank" class="block text-xs text-slate-500 mt-2 italic ${linkClass}">Quelle: AT-Alert</a>`;
        }
      }
      if (key === 'pandemic' && hazard) {
        if (hazard.level !== 'green') {
          if (hazard.summary) extraHtml = `<p class="text-xs text-slate-500 mt-1 italic">${hazard.summary.substring(0, 150)}...</p>`;

          if (hazard.details && hazard.details.length > 0) {
            const links = hazard.details.map(d => `<a href="${d.url}" target="_blank" class="text-yellow-400 hover:text-yellow-200 no-underline">${d.name}</a>`).join(', ');
            thresholdHtml = `<p class="text-xs text-slate-500 mt-2 italic">Warnung vor: ${links}</p>`;
          }
        } else if (sourceUrl) {
          thresholdHtml = `<a href="${sourceUrl}" target="_blank" class="block text-xs text-slate-500 mt-2 italic ${linkClass}">Quelle: WHO / MedUni Wien</a>`;
        }
      }
      if (key === 'fire' && hazard) {
        const parts = [];
        const wbiLabels = { 1: 'gering', 2: 'mäßig', 3: 'erhöht', 4: 'hoch', 5: 'sehr hoch' };
        parts.push(`WBI: ${hazard.value} (${wbiLabels[hazard.value] ?? '?'})`);
        if (hazard.hotspots > 0) {
          parts.push(`<span class="text-red-500 font-bold">NASA: ${hazard.hotspots} Hotspots detektiert</span>`);
        } else {
          parts.push(`NASA: Keine Hotspots (20km)`);
        }
        if (parts.length > 0) extraHtml = `<p class="text-xs text-slate-400 mt-1">${parts.join(' · ')}</p>`;
      }
      if (key === 'uwz' && hazard) {
        const parts = [];
        parts.push(`Wien: ${hazard.city || 'Keine Warnung'}`);
        parts.push(`Leopoldstadt: ${hazard.district || 'Keine Warnung'}`);
        if (parts.length > 0) extraHtml = `<p class="text-xs text-slate-400 mt-1">${parts.join(' · ')}</p>`;
      }
      if (key === 'space' && hazard) {
        const parts = [];
        const { g, s, r } = hazard.scales || { g: 0, s: 0, r: 0 };
        parts.push(`G: ${g}`);
        parts.push(`S: ${s}`);
        parts.push(`R: ${r}`);
        if (parts.length > 0) extraHtml = `<p class="text-xs text-slate-400 mt-1 font-mono">${parts.join(' | ')} (Skala 0-5)</p>`;
      }
      if (hazard?.extraLinks?.length) {
        const links = hazard.extraLinks.map(l => `<a href="${l.url}" target="_blank" class="text-slate-400 hover:text-slate-300 no-underline">${l.name}</a>`).join(' · ');
        extraHtml += `<p class="text-[10px] text-slate-500 mt-2 border-t border-slate-700/50 pt-1 leading-tight">${links}</p>`;
      }

      return `
        <div class="rounded-2xl border border-slate-800 bg-slate-900/60 p-5 card-glow-${level} transition-all duration-1000">
          <div class="flex items-start justify-between gap-3">
            <div class="flex items-center gap-3">
              <span class="text-2xl">${icon}</span>
              <div>
                <p class="font-semibold text-slate-100">${title}</p>
                <p class="text-xs text-slate-500">${sub}</p>
              </div>
            </div>
            <span class="badge-${level} shrink-0 px-2.5 py-1 rounded-full border text-xs font-bold transition-colors duration-500">${LEVEL_LABEL[level]}</span>
          </div>
          <p class="mt-4 text-3xl font-bold tabular-nums tracking-tight text-slate-100">${value}</p>
          ${extraHtml}
          ${thresholdHtml}
        </div>`;
    }

    function updateRelativeTime() {
      if (!lastFetchedData || !lastFetchedData.fetchedAt) return;
      const lastUpdateEl = document.getElementById('lastUpdate');
      const d = new Date(lastFetchedData.fetchedAt);
      const diffMs = Date.now() - d.getTime();
      const diffSec = Math.floor(diffMs / 1000);
      const diffMin = Math.floor(diffSec / 60);

      let timeStr = 'Gerade eben';
      if (diffMin > 0) {
        timeStr = `vor ${diffMin} Min.`;
      } else if (diffSec > 10) {
        timeStr = `vor ${diffSec} Sek.`;
      }

      const exactTime = d.toLocaleTimeString('de-AT', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
      lastUpdateEl.innerHTML = `<span class="opacity-60">Zuletzt aktualisiert:</span> <span class="font-medium text-slate-300 ml-1">${exactTime}</span> <span class="text-[10px] ml-1 bg-slate-800 px-1.5 py-0.5 rounded text-slate-400 font-mono">${timeStr}</span>`;
      lastUpdateEl.classList.remove('hidden');

      // Warning if data is older than 8 minutes (should be 5 min)
      const warningEl = document.getElementById('errorMsg');
      if (diffMin >= 8) {
        warningEl.textContent = `⚠️ Hinweis: Die Daten sind bereits ${diffMin} Minuten alt. Möglicherweise verzögert sich die Aktualisierung.`;
        warningEl.classList.remove('hidden');
      } else if (!lastFetchedData.error) {
        warningEl.classList.add('hidden');
      }
    }

    async function loadStatus() {
      if (isFetching && lastFetchedData) return;
      isFetching = true;

      const lastUpdateEl = document.getElementById('lastUpdate');
      lastUpdateEl.classList.add('animate-pulse');

      try {
        // Primary: Netlify Function (live data from APIs)
        let data;
        try {
          const res = await fetch('/.netlify/functions/refresh', { cache: 'no-store' });
          if (!res.ok) throw new Error(`Function HTTP ${res.status}`);
          data = await res.json();
        } catch (fnErr) {
          // Fallback: static file (last known good from GitHub Actions)
          console.warn('Live fetch failed, falling back to static file:', fnErr.message);
          const cb = `${Date.now()}-${Math.random().toString(36).substring(7)}`;
          const res = await fetch(`./alert_status.json?cb=${cb}`, { cache: 'no-store' });
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          data = await res.json();
        }

        lastFetchedData = data;

        // Overall banner
        const overall = data.overall ?? 'unknown';
        const banner = document.getElementById('overallBanner');
        applyLevel(banner, overall, 'card-glow');
        applyLevel(document.getElementById('overallDot'), overall, 'dot');
        applyLevel(document.getElementById('overallBadge'), overall, 'badge');
        document.getElementById('overallText').textContent = LEVEL_TEXT[overall] ?? overall;
        document.getElementById('overallBadge').textContent = LEVEL_LABEL[overall] ?? overall;

        // Hazard cards
        const grid = document.getElementById('hazardGrid');
        const severityRank = { red: 3, yellow: 2, green: 1, unknown: 0 };

        const sortedHazards = Object.entries(LABELS)
          .map(([key, label]) => ({ key, label, data: data.hazards?.[key] }))
          .sort((a, b) => {
            const rankA = severityRank[a.data?.level] ?? 0;
            const rankB = severityRank[b.data?.level] ?? 0;
            if (rankA !== rankB) return rankB - rankA;
            // Stable sort by original order if severity is same
            return Object.keys(LABELS).indexOf(a.key) - Object.keys(LABELS).indexOf(b.key);
          });

        grid.innerHTML = sortedHazards
          .map(({ key, data: hazardData }) => renderHazardCard(key, hazardData))
          .join('');

        // Data source
        document.getElementById('dataSource').textContent =
          `Datenquelle: ${data.dataSource ?? 'Unbekannt'} · Standort: ${data.location?.address ?? ''}`;

        // Error handling
        const errEl = document.getElementById('errorMsg');
        if (data.error) {
          errEl.textContent = `⚠️ Fehler beim letzten Datenabruf: ${data.error}`;
          errEl.classList.remove('hidden');
        } else {
          errEl.classList.add('hidden');
        }

        updateRelativeTime();
      } catch (err) {
        console.error('Dashboard load error:', err);
        const errEl = document.getElementById('errorMsg');
        errEl.textContent = `Verbindungsfehler: ${err.message}`;
        errEl.classList.remove('hidden');
      } finally {
        isFetching = false;
        lastUpdateEl.classList.remove('animate-pulse');
      }
    }

    // Initialize
    loadStatus();

    // Aggressive polling: Every 60 seconds (down from 5 min)
    setInterval(loadStatus, 60 * 1000);

    // Relative time update: Every 5 seconds
    setInterval(updateRelativeTime, 5000);

    // Visibility listener: Refresh immediately when tab becomes active
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') {
        loadStatus();
      }
    });

    // ── PWA & Installation ───────────────────────────────────────────
    let deferredPrompt;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      document.getElementById('installBtn').classList.remove('hidden');
    });

    document.getElementById('installBtn').addEventListener('click', async () => {
      if (!deferredPrompt) return;
      deferredPrompt.prompt();
      const { outcome } = await deferredPrompt.userChoice;
      if (outcome === 'accepted') {
        document.getElementById('installBtn').classList.add('hidden');
      }
      deferredPrompt = null;
    });

    window.addEventListener('appinstalled', () => {
      document.getElementById('installBtn').classList.add('hidden');
      deferredPrompt = null;
    });

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js?v=3').then(reg => {
          reg.onupdatefound = () => {
            const newSW = reg.installing;
            newSW.onstatechange = () => {
              if (newSW.state === 'installed' && navigator.serviceWorker.controller) {
                window.location.reload();
              }
            };
          };
        }).catch(err => console.warn('SW registration failed:', err));
      });
    }
  </script>
</body>

</html>
