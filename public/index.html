<!DOCTYPE html>
<html lang="de" class="dark">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Disaster Management – Schüttelstraße 79 & 81</title>
  <meta name="description"
    content="Echtzeit-Gefahrenwarnsystem für die Gründerzeithäuser Schüttelstraße 79 und 81 in Wien." />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#0f172a" />
  <link rel="apple-touch-icon" href="/favicon.png" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            slate: { 950: '#0b0f1a' },
          },
          animation: {
            'pulse-slow': 'pulse 3s cubic-bezier(0.4,0,0.6,1) infinite',
          },
        },
      },
    };
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    body {
      font-family: 'Inter', sans-serif;
    }

    .card-glow-green {
      box-shadow: 0 0 24px -4px rgba(34, 197, 94, .35);
    }

    .card-glow-yellow {
      box-shadow: 0 0 24px -4px rgba(234, 179, 8, .35);
    }

    .card-glow-red {
      box-shadow: 0 0 24px -4px rgba(239, 68, 68, .45);
    }

    .card-glow-unknown {
      box-shadow: 0 0 24px -4px rgba(100, 116, 139, .25);
    }

    .badge-green {
      background: rgba(34, 197, 94, .15);
      color: #4ade80;
      border-color: rgba(34, 197, 94, .3);
    }

    .badge-yellow {
      background: rgba(234, 179, 8, .15);
      color: #facc15;
      border-color: rgba(234, 179, 8, .3);
    }

    .badge-red {
      background: rgba(239, 68, 68, .15);
      color: #f87171;
      border-color: rgba(239, 68, 68, .3);
    }

    .badge-unknown {
      background: rgba(100, 116, 139, .15);
      color: #94a3b8;
      border-color: rgba(100, 116, 139, .3);
    }

    .dot-green {
      background: #22c55e;
    }

    .dot-yellow {
      background: #eab308;
    }

    .dot-red {
      background: #ef4444;
    }

    .dot-unknown {
      background: #64748b;
    }

    @media (min-width: 640px) {
      #hazardGrid {
        container-type: size;
        container-name: gridcontainer;
      }
    }

    @container gridcontainer (max-height: 650px) {
      .hazard-sub { display: none !important; }
      .hazard-footer { display: none !important; }
      .hazard-threshold { display: none !important; }
      .hazard-card { padding: 0.5rem 0.75rem !important; }
      .hazard-title { font-size: 13px !important; }
      .hazard-value { font-size: 18px !important; }
      .hazard-extra { margin-top: 0 !important; }
    }

    @container gridcontainer (max-height: 450px) {
      .hazard-extra { display: none !important; }
      .hazard-icon { transform: scale(0.8); }
      .hazard-title { font-size: 12px !important; }
      .hazard-value { font-size: 15px !important; }
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(12px)
      }

      to {
        opacity: 1;
        transform: translateY(0)
      }
    }

    .fade-in {
      animation: fadeIn .45s ease both;
    }

    .fade-in-2 {
      animation: fadeIn .45s .12s ease both;
    }

    .fade-in-3 {
      animation: fadeIn .45s .24s ease both;
    }

    /* Hide scrollbar for Chrome, Safari and Opera */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }

    /* Hide scrollbar for IE, Edge and Firefox */
    .no-scrollbar {
      -ms-overflow-style: none;  /* IE and Edge */
      scrollbar-width: none;  /* Firefox */
    }
  </style>
</head>

<body
  class="bg-[#0b0f1a] text-slate-100 font-sans selection:bg-cyan-500/30 overflow-hidden h-screen flex items-center justify-center">
  <div
    class="h-[98vh] w-[98vw] flex flex-col p-2 sm:p-4 bg-slate-900/20 rounded-[2rem] border border-slate-800/50 shadow-2xl overflow-hidden">
    <header class="shrink-0 mb-4">
      <div class="flex items-center justify-between gap-4">
        <!-- Left: Logo + Separator + Title + Overall Status -->
        <div class="flex items-center gap-3 sm:gap-4 min-w-0">
          <div
            class="w-10 h-10 sm:w-12 sm:h-12 bg-slate-800 rounded-2xl flex items-center justify-center shadow-lg border border-slate-700 shrink-0">
            <span class="text-xl sm:text-2xl">🏛️</span>
          </div>
          <!-- Thin vertical separator -->
          <div class="w-px self-stretch bg-slate-700/60 shrink-0"></div>
          <!-- Title block -->
          <div class="shrink-0">
            <h1 class="text-xl sm:text-2xl font-bold text-slate-100 tracking-tight leading-none">Schüttelstraße 79 &amp; 81</h1>
            <p class="text-[14px] text-slate-400 mt-1">1020 Wien - Vorbeugender Katastrophenschutz</p>
          </div>
          <!-- Thin vertical separator -->
          <div class="w-px self-stretch bg-slate-700/60 shrink-0 hidden sm:block"></div>
          <!-- Inline Overall Status -->
          <div id="overallInline" class="hidden sm:flex items-center gap-2.5 min-w-0">
            <div id="overallDot" class="w-3 h-3 rounded-full animate-pulse-slow shrink-0"></div>
            <p id="overallText" class="text-sm font-semibold text-slate-200 truncate"></p>
            <div id="overallBadge" class="shrink-0 px-2.5 py-0.5 rounded-full border text-[11px] font-bold"></div>
          </div>
        </div>
        <!-- Center: Live Clock -->
        <p id="liveClock" class="text-xl sm:text-[22px] font-medium sm:font-normal tabular-nums tracking-tight hidden sm:block" style="color: #00e600;"></p>
        <!-- Right: lastUpdate + version + installBtn -->
        <div class="flex items-center gap-2">
          <div id="lastUpdate" class="text-[14px] text-slate-500 text-right hidden sm:block"></div>
          <div
            class="h-[22px] inline-flex items-center px-2 bg-slate-800 border border-slate-700 rounded text-[14px] font-mono text-slate-400">
            v1.16.1</div>
          <button id="installBtn"
            class="hidden ml-2 px-3 py-1.5 bg-cyan-600 hover:bg-cyan-500 text-white text-xs font-bold rounded-full transition-all flex items-center gap-1.5 shadow-lg shadow-cyan-900/20">
            <span>📲 App installieren</span>
          </button>
        </div>
      </div>
    </header>

    <main class="flex-1 flex flex-col min-h-0 overflow-y-auto sm:overflow-hidden no-scrollbar">

      <!-- Hazard Indicators Section -->
      <div class="flex-none sm:flex-1 flex flex-col min-h-0 sm:overflow-hidden">
        <p class="shrink-0 text-[10px] sm:text-xs font-bold uppercase tracking-[0.2em] text-slate-500 mb-2 ml-1">

        <div class="sm:overflow-y-hidden sm:flex-1 sm:min-h-0 pr-1 w-full flex flex-col">

            <!-- Cards will be injected here -->
          </div>
          <p id="errorMsg" class="text-xs text-red-400 mt-2 hidden p-2 bg-red-900/20 border border-red-500/30 rounded"></p>
        </div>
      </div>
    </main>
  </div>

    const LEVEL_TEXT = { green: 'Alles im grünen Bereich', yellow: 'Erhöhte Wachsamkeit empfohlen', red: 'Sofortige Maßnahmen erforderlich!', unknown: 'Daten werden geladen …' };
    const LEVEL_LABEL = { green: 'SICHER', yellow: 'WARNUNG', red: 'ALARM', unknown: 'UNBEKANNT' };

    let lastFetchedData = null;
    let isFetching = false;

    function applyLevel(el, level, part) {
      if (!el) return;
      el.classList.remove(...['green', 'yellow', 'red', 'unknown'].map(l => `${part}-${l}`));
      el.classList.add(`${part}-${level}`);
    }

    function formatValue(key, hazard) {
      if (!hazard || (hazard.value == null && hazard.pegelCm == null)) {
        return '— Kein Messwert —';
      }

      let val = hazard.value ?? hazard.pegelCm;
      let unit = hazard.unit ?? '';
      const renderPipe = () => `<span class="mx-2 opacity-50 text-slate-100 sm:text-slate-400">|</span>`;

      if (key === 'flood') {
        const trendMap = { 'Erhöhung': '↑', 'Verringerung': '↓', 'Gleichbleibend': '→', 'Stabil': '→' };
        const arrow = hazard.trend ? (trendMap[hazard.trend] || '') : '';
        return `${val} ${unit} ${arrow}`.trim();
      }

      if (key === 'heat') {
        const uvPart = hazard.uvi != null ? `${renderPipe()}UV ${hazard.uvi}` : '';
        return `${val} ${unit}${uvPart}`;
      }

      if (key === 'atAlert' || key === 'pandemic' || key === 'airQuality') {
        if (!hazard || (hazard.value == null && hazard.pegelCm == null)) return 'Keine Meldungen / Daten';
        if (key === 'airQuality') {
          const aqiDisplay = hazard.aqi != null ? `AQI ${hazard.aqi}` : `PM10 ${val}`;
          return hazard.luftIndex != null ? `${aqiDisplay} ${renderPipe()} LGI ${hazard.luftIndex}` : aqiDisplay;
        }
        return `${hazard.value} ${hazard.unit}`;
      }
      if (key === 'power') {
        return hazard?.message ?? 'Normalbetrieb';
      }
      if (key === 'winter') {
        return hazard?.value ?? 'Sicher';
      }
      if (key === 'space') {
        return `Kp ${val}`;
      }
      if (key === 'blackout') {
        const valHz = typeof val === 'number' ? val.toFixed(3) : val;
        return `${valHz} Hz`;
      }
      if (key === 'pressure') {
        const trend = hazard.trend || '→';
        return `${val != null ? Math.round(val) : '—'} hPa ${trend}`;
      }
      if (key === 'uwz') {
        return hazard.value || 'Keine Warnung';
      }
      if (key === 'wind') {
        const humPart = hazard.humidity != null ? `${renderPipe()}${hazard.humidity}%` : '';
        return `${val} ${unit}${humPart}`;
      }

      return `${val}${unit ? ' ' + unit : ''}`;
    }

    function renderWeatherWidget(hazard) {
      if (!hazard || !hazard.forecast) return '';
      const daily = hazard.forecast.daily;
      if (!daily) return '';

      const D = daily.time.length;
      const VW = 600, VH = 60, CH = 72; // CH = container height px

      // Returns only SVG paths (no text — text stretches with preserveAspectRatio:none)
      const buildPaths = (vals, strokeColor, fillColor) => {
        if (!vals || !vals.length) return '<text x="300" y="30" text-anchor="middle" font-size="10" fill="#64748b" font-family="sans-serif">Keine Daten</text>';
        const lo = Math.min(...vals), hi = Math.max(...vals, lo + 0.1);
        const pts = vals.map((v, i) => {
          const x = (i / (D - 1)) * VW;
          const y = 55 - ((v - lo) / (hi - lo)) * 48;
          return `${x.toFixed(1)},${y.toFixed(1)}`;
        });
        const line = `M ${pts.join(' L ')}`;
        const fill = `${line} L ${VW},${VH} L 0,${VH} Z`;
        return `<path d="${fill}" fill="${fillColor}"/><path d="${line}" fill="none" stroke="${strokeColor}" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>`;
      };

      // Returns HTML label spans positioned absolutely over the chart container
      const buildLabels = (vals, suffix) => {
        if (!vals || !vals.length) return '';
        const lo = Math.min(...vals), hi = Math.max(...vals, lo + 0.1);
        return vals.map((v, i) => {
          const svgY  = 55 - ((v - lo) / (hi - lo)) * 48 - 5; // same y as curve, nudge up
          const topPx = Math.max(0, (svgY / VH) * CH - 10);    // convert to container px, keep in bounds
          const leftPct = (i / (D - 1)) * 100;
          const tx = i === 0 ? 'translateX(0)' : i === D - 1 ? 'translateX(-100%)' : 'translateX(-50%)';
          return `<span style="position:absolute;left:${leftPct.toFixed(1)}%;top:${topPx.toFixed(0)}px;transform:${tx};font-size:9px;color:#94a3b8;font-weight:500;white-space:nowrap;pointer-events:none">${Math.round(v)}${suffix}</span>`;
        }).join('');
      };

      const series = {
        temp:   { paths: buildPaths(daily.temperature_2m_max,           '#ffcc00', 'rgba(255,204,0,0.2)'),   labels: buildLabels(daily.temperature_2m_max,           '\u00b0') },
        precip: { paths: buildPaths(daily.precipitation_probability_max, '#38bdf8', 'rgba(56,189,248,0.2)'),  labels: buildLabels(daily.precipitation_probability_max, '%') },
        wind:   { paths: buildPaths(daily.wind_speed_10m_max,            '#c084fc', 'rgba(192,132,252,0.2)'), labels: buildLabels(daily.wind_speed_10m_max,            '') },
      };

      // X-axis day labels (HTML — never stretch)
      const dayLabels = daily.time.map((t, i) => {
        const pct  = D > 1 ? (i / (D - 1)) * 100 : 0;
        const name = new Date(t).toLocaleDateString('de-AT', { weekday: 'short' }) + '.';
        const align = i === 0 ? 'left:0;transform:none' : i === D-1 ? `left:${pct.toFixed(1)}%;transform:translateX(-100%)` : `left:${pct.toFixed(1)}%;transform:translateX(-50%)`;
        return `<span style="position:absolute;${align};white-space:nowrap">${name}</span>`;
      }).join('');

      const wmoIcon = c => {
        if (c === 0) return '\u2600\ufe0f';
        if (c <= 2)  return '\ud83c\udf24\ufe0f';
        if (c === 3) return '\u2601\ufe0f';
        if (c <= 48) return '\ud83c\udf2b\ufe0f';
        if (c <= 67) return '\ud83c\udf27\ufe0f';
        if (c <= 77) return '\u2744\ufe0f';
        if (c <= 82) return '\ud83c\udf26\ufe0f';
        return '\u26c8\ufe0f';
      };

      const tiles = daily.time.slice(0, D).map((t, i) => {
        const day  = new Date(t).toLocaleDateString('de-AT', { weekday: 'short' }) + '.';
        const icon = wmoIcon(daily.weather_code[i]);
        const hi   = Math.round(daily.temperature_2m_max[i]);
        const lo   = Math.round(daily.temperature_2m_min[i]);
        const bg   = i === 0 ? 'background:rgba(51,65,85,0.9);border-radius:8px;' : '';
        return `<div style="flex:1;display:flex;flex-direction:column;align-items:center;padding:6px 2px;${bg}">
          <span style="font-size:13px;color:${i===0?'#e2e8f0':'#94a3b8'};font-weight:${i===0?600:400}">${day}</span>
          <span style="font-size:28px;line-height:1.3;margin:4px 0">${icon}</span>
          <div style="display:flex;gap:5px;font-size:11px">
            <span style="font-weight:700;color:#e2e8f0">${hi}\u00b0</span>
            <span style="color:#64748b">${lo}\u00b0</span>
          </div>
        </div>`;
      }).join('');

      return `
        <div class="hazard-card sm:col-span-2 lg:col-span-2 lg:row-start-5 lg:col-start-1 rounded-2xl border border-slate-800 bg-slate-900/60 px-3 py-2 sm:py-3 sm:px-4 transition-all duration-1000 h-full flex flex-col overflow-hidden" style="min-height:240px">

          <!-- Header: icon + title + tabs in one row -->
          <div class="flex items-center gap-3 shrink-0">
            <span class="text-xl shrink-0">\ud83c\udf24\ufe0f</span>
            <div class="min-w-0">
              <p class="text-[14px] font-semibold text-slate-100 sm:text-slate-400 leading-tight">Wetter - Wien</p>
            </div>
            <!-- Tabs next to title -->
            <div class="flex gap-3 ml-2 text-[12px] font-medium shrink-0">
              <button class="weather-tab pb-0.5 text-yellow-400 border-b-2 border-yellow-400" data-chart="temp">Temperatur</button>
              <button class="weather-tab pb-0.5 text-slate-400 hover:text-slate-200 transition-colors border-b-2 border-transparent" data-chart="precip">Niederschlag</button>
              <button class="weather-tab pb-0.5 text-slate-400 hover:text-slate-200 transition-colors border-b-2 border-transparent" data-chart="wind">Wind</button>
            </div>
            <span class="badge-green ml-auto shrink-0 px-2 py-0.5 rounded-full border text-[10px] font-bold">INFO</span>
          </div>

          <!-- SVG Chart + HTML label overlay (labels stay fixed-size, don't stretch) -->
          <div class="shrink-0 relative" style="height:${CH}px;margin-top:6px">
            <svg id="wchart-temp"   class="wchart absolute inset-0 w-full h-full" viewBox="0 0 ${VW} ${VH}" preserveAspectRatio="none">${series.temp.paths}</svg>
            <svg id="wchart-precip" class="wchart absolute inset-0 w-full h-full" viewBox="0 0 ${VW} ${VH}" preserveAspectRatio="none" style="display:none">${series.precip.paths}</svg>
            <svg id="wchart-wind"   class="wchart absolute inset-0 w-full h-full" viewBox="0 0 ${VW} ${VH}" preserveAspectRatio="none" style="display:none">${series.wind.paths}</svg>
            <div id="wlabels-temp"   class="wlabels absolute inset-0">${series.temp.labels}</div>
            <div id="wlabels-precip" class="wlabels absolute inset-0" style="display:none">${series.precip.labels}</div>
            <div id="wlabels-wind"   class="wlabels absolute inset-0" style="display:none">${series.wind.labels}</div>
          </div>

          <!-- X-axis: day labels -->
          <div class="shrink-0 relative" style="height:16px;font-size:10px;color:#64748b;margin-top:2px">
            ${dayLabels}
          </div>

          <!-- Day tiles -->
          <div class="shrink-0 flex mt-1 pt-2 border-t border-slate-700/50">${tiles}</div>
        </div>`;
    }


    function renderHazardCard(key, hazard) {

      if (key === 'weatherWidget') {
        return renderWeatherWidget(hazard);
      }

      const { icon, title, sub } = LABELS[key];
      const level = hazard?.level ?? 'unknown';
      const value = formatValue(key, hazard);

      let thresholdHtml = '';
      const sourceUrl = hazard?.sourceUrl;
      const linkClass = "hover:text-slate-300 transition-colors no-underline";

      if (hazard?.thresholds) {
        const t = hazard.thresholds;
        let innerContent = `Schwellenwerte: <span class="text-yellow-500/80">${t.yellow}</span> / <span class="text-red-500/80">${t.red}</span> ${hazard.unit}`;

        if (key === 'ice') {
          innerContent = `Logik: <span class="text-yellow-500/80">${t.yellow}</span> (Reif/Nässe) / <span class="text-red-500/80">${t.red}</span> (Regen)`;
        }

        thresholdHtml = `<p class="text-xs text-slate-300 sm:text-slate-400 mt-1 sm:font-medium italic">${innerContent}</p>`;
      }

      let extraHtml = '';
      if (key === 'heat' && hazard) {
        if (hazard.uvi != null) {
          const uv = hazard.uvi;
          let uvCat = 'Gering';
          let uvColor = 'text-green-400';
          if (uv >= 11) { uvCat = 'Extrem'; uvColor = 'text-purple-500'; }
          else if (uv >= 8) { uvCat = 'Sehr hoch'; uvColor = 'text-red-500'; }
          else if (uv >= 6) { uvCat = 'Hoch'; uvColor = 'text-orange-500'; }
          else if (uv >= 3) { uvCat = 'Mittel'; uvColor = 'text-yellow-400'; }

          extraHtml = `<p class="text-xs text-slate-400 mt-1">UV-Index: <span class="${uvColor} font-bold">${uv} (${uvCat})</span></p>`;
        }

        if (hazard.tempHistory && hazard.tempHistory.length > 1 && hazard.uvHistory && hazard.uvHistory.length > 1) {
          extraHtml += `
            <div class="flex items-center gap-3 text-[11px] text-slate-400 mt-2 font-medium">
              <span class="flex items-center gap-1">
                <span class="w-2.5 h-0.5 rounded bg-rose-500"></span> Temp. (°C)
              </span>
              <span class="flex items-center gap-1">
                <span class="w-2.5 h-0.5 rounded bg-yellow-500"></span> UV-Index
              </span>
            </div>
          `;

          // Calculate Temp points
          const minTemp = Math.min(...hazard.tempHistory);
          const maxTemp = Math.max(...hazard.tempHistory);
          const tempRange = (maxTemp - minTemp) || 1;
          const tempPoints = hazard.tempHistory.map((val, i) => {
            const x = (i / (hazard.tempHistory.length - 1)) * 300;
            const y = 35 - ((val - minTemp) / tempRange) * 30;
            return `${x.toFixed(1)},${y.toFixed(1)}`;
          });
          const tempPathD = `M ${tempPoints.join(' L ')}`;

          // Calculate UV points
          const minUV = Math.min(...hazard.uvHistory);
          const maxUV = Math.max(...hazard.uvHistory);
          const uvRange = (maxUV - minUV) || 1;
          const uvPoints = hazard.uvHistory.map((val, i) => {
            const x = (i / (hazard.uvHistory.length - 1)) * 300;
            const y = 35 - ((val - minUV) / uvRange) * 30;
            return `${x.toFixed(1)},${y.toFixed(1)}`;
          });
          const uvPathD = `M ${uvPoints.join(' L ')}`;

          extraHtml += `
            <div class="mt-3 h-12 w-full relative">
              <svg viewBox="0 0 300 40" class="w-full h-full overflow-visible" preserveAspectRatio="none">
                <path d="${tempPathD}" fill="none" stroke="rgba(244, 63, 94, 0.75)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                <path d="${uvPathD}" fill="none" stroke="rgba(234, 179, 8, 0.75)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
              </svg>
            </div>`;
        }
      }

      if (key === 'wind' && hazard) {
        if (hazard.windHistory && hazard.windHistory.length > 1 && hazard.humHistory && hazard.humHistory.length > 1) {
          extraHtml = `
            <div class="flex items-center gap-3 text-[11px] text-slate-400 mt-2 font-medium">
              <span class="flex items-center gap-1">
                <span class="w-2.5 h-0.5 rounded bg-purple-500"></span> Wind (km/h)
              </span>
              <span class="flex items-center gap-1">
                <span class="w-2.5 h-0.5 rounded bg-cyan-500"></span> Feuchtigkeit (%)
              </span>
            </div>
          `;

          // Calculate Wind points
          const minWind = Math.min(...hazard.windHistory);
          const maxWind = Math.max(...hazard.windHistory);
          const windRange = (maxWind - minWind) || 1;
          const windPoints = hazard.windHistory.map((val, i) => {
            const x = (i / (hazard.windHistory.length - 1)) * 300;
            const y = 35 - ((val - minWind) / windRange) * 30;
            return `${x.toFixed(1)},${y.toFixed(1)}`;
          });
          const windPathD = `M ${windPoints.join(' L ')}`;

          // Calculate Humidity points
          const minHum = Math.min(...hazard.humHistory);
          const maxHum = Math.max(...hazard.humHistory);
          const humRange = (maxHum - minHum) || 1;
          const humPoints = hazard.humHistory.map((val, i) => {
            const x = (i / (hazard.humHistory.length - 1)) * 300;
            const y = 35 - ((val - minHum) / humRange) * 30;
            return `${x.toFixed(1)},${y.toFixed(1)}`;
          });
          const humPathD = `M ${humPoints.join(' L ')}`;

          extraHtml += `
            <div class="mt-3 h-12 w-full relative">
              <svg viewBox="0 0 300 40" class="w-full h-full overflow-visible" preserveAspectRatio="none">
                <path d="${windPathD}" fill="none" stroke="rgba(168, 85, 247, 0.75)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                <path d="${humPathD}" fill="none" stroke="rgba(6, 182, 212, 0.75)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
              </svg>
            </div>`;
        }
      }

      if (key === 'airQuality' && hazard) {
        const parts = [];
        if (hazard.pm10 != null) parts.push(`PM10: ${hazard.pm10} µg/m³`);
        if (hazard.pm25 != null) parts.push(`PM2.5: ${hazard.pm25} µg/m³`);
        if (parts.length) extraHtml = `<p class="text-xs text-slate-400 mt-1">${parts.join(' · ')}</p>`;
      }
      if (key === 'earthquake' && hazard) {
        const parts = [];
        if (hazard.distanceKm != null) parts.push(`Entfernung: ${hazard.distanceKm} km`);
        if (hazard.depthKm != null) parts.push(`Tiefe: ${hazard.depthKm} km`);
        if (hazard.time) {
          const t = new Date(hazard.time);
          parts.push(`Zeit: ${t.toLocaleString('de-AT', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' })}`);
        }
        if (hazard.eventCount > 1) parts.push(`${hazard.eventCount} Ereignisse (24h)`);
        if (parts.length) extraHtml = `<p class="text-xs text-slate-400 mt-1">${parts.join(' · ')}</p>`;
      }
      if (key === 'atAlert' && hazard) {
        const detailParts = [];

        // ── AT-Alert civil protection warnings (terrorism, crime, CBRN, etc.) ──
        if (hazard.alertLevel && hazard.title) {
          const levelEmoji = { Extreme: '🚨', Severe: '🚨', Moderate: '⚠️', Minor: '⚠️' }[hazard.alertLevel] ?? '⚠️';
          detailParts.push(`<span class="font-semibold text-yellow-300">${levelEmoji} Behördl. Warnung:</span> ${hazard.title}`);
          if (hazard.sender) detailParts.push(`Absender: ${hazard.sender}`);
          if (hazard.expires) {
            const t = new Date(hazard.expires);
            detailParts.push(`Gültig bis: ${t.toLocaleString('de-AT', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' })}`);
          }
        }

        // ── GeoSphere meteorological warnings ─────────────────────────────────
        if (hazard.warnType && hazard.warnLevel) {
          const wlvlEmoji = hazard.warnLevel >= 3 ? '🔴' : (hazard.isOrange ? '🟠' : '🟡');
          const wlvlLabel = hazard.warnLevel >= 3 ? 'Rot' : (hazard.isOrange ? 'Orange' : 'Gelb');
          detailParts.push(`<span class="font-semibold text-sky-300">${wlvlEmoji} Wetterwarnung (${wlvlLabel}):</span> ${hazard.warnType}`);
        }

        // ── Combined description / meteotext ──────────────────────────────────
        const desc = hazard.description ?? hazard.meteoText;
        if (desc) detailParts.push(`<span class="text-slate-500 italic">${desc.slice(0, 140)}${desc.length > 140 ? '…' : ''}</span>`);

        if (detailParts.length) {
          extraHtml = `<div class="text-xs text-slate-400 mt-1 space-y-0.5">${detailParts.map(p => `<p>${p}</p>`).join('')}</div>`;
        }
      }
      if (key === 'pandemic' && hazard) {
        if (hazard.level !== 'green') {
          if (hazard.summary) extraHtml = `<p class="text-xs text-slate-500 mt-1 italic">${hazard.summary.substring(0, 150)}...</p>`;

          if (hazard.details && hazard.details.length > 0) {
            const links = hazard.details.map(d => `<a href="${d.url}" target="_blank" class="text-yellow-400 hover:text-yellow-200 no-underline">${d.name}</a>`).join(', ');
            extraHtml += `<p class="text-xs text-slate-500 mt-2 italic">Warnung vor: ${links}</p>`;
          }
        }
      }
      if (key === 'fire' && hazard) {
        const parts = [];
        const wbiLabels = { 1: 'gering', 2: 'mäßig', 3: 'erhöht', 4: 'hoch', 5: 'sehr hoch' };
        parts.push(`WBI: ${hazard.value} (${wbiLabels[hazard.value] ?? '?'})`);
        if (hazard.hotspots > 0) {
          parts.push(`<span class="text-red-500 font-bold">NASA: ${hazard.hotspots} Hotspots detektiert</span>`);
        } else {
          parts.push(`NASA: Keine Hotspots (20km)`);
        }
        if (parts.length > 0) extraHtml = `<p class="text-xs text-slate-400 mt-1">${parts.join(' · ')}</p>`;
      }
      if (key === 'uwz' && hazard) {
        const parts = [];
        parts.push(`Wien: ${hazard.city || 'Keine Warnung'}`);
        parts.push(`Leopoldstadt: ${hazard.district || 'Keine Warnung'}`);
        if (parts.length > 0) extraHtml = `<p class="text-xs text-slate-400 mt-1">${parts.join(' · ')}</p>`;
      }
      if (key === 'space' && hazard) {
        const parts = [];
        const { g, s, r } = hazard.scales || { g: 0, s: 0, r: 0 };
        if (g > 0) parts.push(`G${g}`);
        if (s > 0) parts.push(`S${s}`);
        if (r > 0) parts.push(`R${r}`);
        const scalesText = parts.length > 0 ? parts.join(' | ') : 'Keine Stürme aktiv';
        extraHtml = `<p class="text-xs text-slate-400 mt-1 font-mono">${scalesText} (Skala 0-5)</p>`;
      }

      if (key === 'radiation' && hazard) {
        if (hazard.remoteWarning) {
          extraHtml = `<div class="mt-2 p-2 bg-red-900/30 border border-red-500/50 rounded-lg">
            <p class="text-[11px] text-red-200 font-bold uppercase tracking-wider">Umkreis-Warnung (500km)</p>
            <p class="text-xs text-red-100 mt-0.5">⚠️ <b>${hazard.remoteWarning.value} nSv/h</b> in ${hazard.remoteWarning.name} (${hazard.remoteWarning.dist.toFixed(0)}km).</p>
          </div>`;
        } else {
          extraHtml = `<p class="text-[11px] text-slate-500 mt-1 italic">Keine Werte > 300 nSv/h im Umkreis (500km)</p>`;
        }

        if (hazard.history && hazard.history.length > 1) {
          const minVal = Math.min(...hazard.history);
          const maxVal = Math.max(...hazard.history);
          const range = maxVal - minVal || 1;
          const points = hazard.history.map((val, i) => {
            const x = (i / (hazard.history.length - 1)) * 300;
            const y = 35 - ((val - minVal) / range) * 30;
            return `${x.toFixed(1)},${y.toFixed(1)}`;
          });
          const pathD = `M ${points.join(' L ')}`;
          const gradD = `${pathD} L 300,40 L 0,40 Z`;
          
          extraHtml += `
            <div class="mt-4 h-12 w-full relative">
              <svg viewBox="0 0 300 40" class="w-full h-full overflow-visible" preserveAspectRatio="none">
                <defs>
                  <linearGradient id="radiationGrad" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0%" stop-color="rgba(245, 158, 11, 0.25)" />
                    <stop offset="100%" stop-color="rgba(245, 158, 11, 0.0)" />
                  </linearGradient>
                </defs>
                <path d="${gradD}" fill="url(#radiationGrad)" />
                <path d="${pathD}" fill="none" stroke="rgba(245, 158, 11, 0.65)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
              </svg>
            </div>`;
        }
      }

      if (key === 'pressure' && hazard && hazard.history && hazard.history.length > 1) {
        const minVal = Math.min(...hazard.history);
        const maxVal = Math.max(...hazard.history);
        const range = maxVal - minVal || 1;
        const points = hazard.history.map((val, i) => {
          const x = (i / (hazard.history.length - 1)) * 300;
          const y = 35 - ((val - minVal) / range) * 30;
          return `${x.toFixed(1)},${y.toFixed(1)}`;
        });
        const pathD = `M ${points.join(' L ')}`;
        const gradD = `${pathD} L 300,40 L 0,40 Z`;
        
        extraHtml = `
          <div class="mt-4 h-12 w-full relative">
            <svg viewBox="0 0 300 40" class="w-full h-full overflow-visible" preserveAspectRatio="none">
              <defs>
                <linearGradient id="pressureGrad" x1="0" y1="0" x2="0" y2="1">
                  <stop offset="0%" stop-color="rgba(56, 189, 248, 0.25)" />
                  <stop offset="100%" stop-color="rgba(56, 189, 248, 0.0)" />
                </linearGradient>
              </defs>
              <path d="${gradD}" fill="url(#pressureGrad)" />
              <path d="${pathD}" fill="none" stroke="rgba(56, 189, 248, 0.65)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          </div>`;
      }

      if (key === 'flood' && hazard && hazard.history && hazard.history.length > 1) {
        const minVal = Math.min(...hazard.history);
        const maxVal = Math.max(...hazard.history);
        const range = maxVal - minVal || 1;
        const points = hazard.history.map((val, i) => {
          const x = (i / (hazard.history.length - 1)) * 300;
          const y = 35 - ((val - minVal) / range) * 30;
          return `${x.toFixed(1)},${y.toFixed(1)}`;
        });
        const pathD = `M ${points.join(' L ')}`;
        const gradD = `${pathD} L 300,40 L 0,40 Z`;
        
        extraHtml = (extraHtml || '') + `
          <div class="mt-4 h-12 w-full relative">
            <svg viewBox="0 0 300 40" class="w-full h-full overflow-visible" preserveAspectRatio="none">
              <defs>
                <linearGradient id="floodGrad" x1="0" y1="0" x2="0" y2="1">
                  <stop offset="0%" stop-color="rgba(59, 130, 246, 0.25)" />
                  <stop offset="100%" stop-color="rgba(59, 130, 246, 0.0)" />
                </linearGradient>
              </defs>
              <path d="${gradD}" fill="url(#floodGrad)" />
              <path d="${pathD}" fill="none" stroke="rgba(59, 130, 246, 0.65)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          </div>`;
      }

      if (key === 'blackout' && hazard && hazard.history && hazard.history.length > 1) {
        const minVal = Math.min(...hazard.history);
        const maxVal = Math.max(...hazard.history);
        let range = maxVal - minVal;
        let adjustedMin = minVal;
        if (range < 0.05) {
          range = 0.05;
          const center = (minVal + maxVal) / 2;
          adjustedMin = center - 0.025;
        }
        const points = hazard.history.map((val, i) => {
          const x = (i / (hazard.history.length - 1)) * 300;
          const y = 35 - ((val - adjustedMin) / range) * 22;
          return `${x.toFixed(1)},${y.toFixed(1)}`;
        });
        const pathD = `M ${points.join(' L ')}`;
        const gradD = `${pathD} L 300,40 L 0,40 Z`;
        
        extraHtml = (extraHtml || '') + `
          <div class="mt-3 h-8 w-full relative">
            <svg viewBox="0 0 300 40" class="w-full h-full overflow-visible" preserveAspectRatio="none">
              <defs>
                <linearGradient id="blackoutGrad" x1="0" y1="0" x2="0" y2="1">
                  <stop offset="0%" stop-color="rgba(20, 184, 166, 0.25)" />
                  <stop offset="100%" stop-color="rgba(20, 184, 166, 0.0)" />
                </linearGradient>
              </defs>
              <path d="${gradD}" id="blackout-curve-grad" fill="url(#blackoutGrad)" />
              <path d="${pathD}" id="blackout-curve-path" fill="none" stroke="rgba(20, 184, 166, 0.65)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          </div>`;
      }

      // ── Footer & Links (Unified) ──
      const footerLinks = [];
      const SOURCE_LABELS = {
        heat: 'ZAMG / GeoSphere', wind: 'ZAMG / GeoSphere', rain: 'ZAMG / GeoSphere',
        flood: 'danubealert', radiation: 'Strahlenschutz.gv.at', airQuality: 'Wien.gv.at',
        earthquake: 'GeoSphere / EMSC', atAlert: 'AT-Alert', pandemic: 'WHO / MedUni Wien',
        fire: 'NASA / GeoSphere', space: 'NOAA / SWPC', power: 'Wiener Netze',
        blackout: 'Netzfrequenzmessung.de',
        pressure: 'GeoSphere Österreich',
        traffic: 'Wiener Linien & Google Maps',
        winter: 'GeoSphere', uwz: 'UWZ.at', thunderstorm: 'GeoSphere / ZAMG'
      };

      if (sourceUrl) {
        const sourceLabel = (key === 'airQuality' && hazard.source?.includes('IQAir')) ? 'IQAir' : (SOURCE_LABELS[key] || 'Quelle');
        footerLinks.push(`<a href="${sourceUrl}" target="_blank" class="${linkClass}">${sourceLabel}</a>`);
      }
      if (hazard?.extraLinks?.length) {
        hazard.extraLinks.forEach(l => {
          footerLinks.push(`<a href="${l.url}" target="_blank" class="${linkClass}">${l.name}</a>`);
        });
      }

      const footerHtml = footerLinks.length
        ? `<div class="mt-2 pt-1 border-t border-slate-700/50 flex flex-wrap gap-x-3 gap-y-1 text-xs text-slate-300 sm:text-slate-400 sm:font-medium leading-tight">${footerLinks.join('<span class="opacity-30">·</span>')}</div>`
        : '';

      const cardIdAttr = key === 'blackout' ? ' id="blackout-card"' : '';
      const valueIdAttr = key === 'blackout' ? ' id="blackout-hz-value"' : '';
      const badgeIdAttr = key === 'blackout' ? ' id="blackout-badge"' : '';

      return `
        <div${cardIdAttr} class="hazard-card rounded-2xl border border-slate-800 bg-slate-900/60 px-3 py-2 sm:py-2 sm:px-4 card-glow-${level} transition-all duration-1000 h-full flex flex-col overflow-hidden">
          <div class="flex items-start justify-between gap-2 shrink-0">
            <div class="flex items-center gap-2 min-w-0">
              <span class="text-xl sm:text-2xl shrink-0 hazard-icon flex items-center justify-center">${icon}</span>
              <div class="min-w-0">
                <p class="hazard-title text-[14px] sm:text-[14.5px] font-semibold text-slate-100 sm:text-slate-400 truncate leading-tight">${title}</p>
                <p class="hazard-sub text-[10px] sm:text-[11px] mt-0.5 text-slate-200 sm:text-slate-400 font-semibold truncate leading-tight">${sub}</p>
              </div>
            </div>
            <span${badgeIdAttr} class="badge-${level} shrink-0 px-2 py-0.5 rounded-full border text-[10px] sm:text-xs font-bold transition-colors duration-500">${LEVEL_LABEL[level]}</span>
          </div>
          <p${valueIdAttr} class="hazard-value mt-2 sm:mt-3 text-xl sm:text-[22px] font-bold sm:font-semibold tabular-nums tracking-tight text-slate-100 shrink-0 leading-none">${value}</p>
          <div class="hazard-extra flex flex-col justify-end flex-1 min-h-0 mt-1">
            <div class="overflow-hidden flex flex-col justify-end flex-1">
              ${extraHtml}
            </div>
            <div class="hazard-threshold">${thresholdHtml}</div>
            <div class="hazard-footer">${footerHtml}</div>
          </div>
        </div>`;
    }

    function updateRelativeTime() {
      if (!lastFetchedData || !lastFetchedData.fetchedAt) return;
      const lastUpdateEl = document.getElementById('lastUpdate');
      const d = new Date(lastFetchedData.fetchedAt);
      const diffMs = Date.now() - d.getTime();
      const diffSec = Math.floor(diffMs / 1000);
      const diffMin = Math.floor(diffSec / 60);

      let timeStr = 'Gerade eben';
      if (diffMin > 0) {
        timeStr = `vor ${diffMin} Min.`;
      } else if (diffSec > 10) {
        timeStr = `vor ${diffSec} Sek.`;
      }

      const exactTime = d.toLocaleTimeString('de-AT', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
      lastUpdateEl.innerHTML = `<span class="opacity-60">Zuletzt aktualisiert:</span> <span class="font-medium text-slate-300 ml-1 whitespace-nowrap">${exactTime}</span> <span class="text-[14px] ml-1 h-[22px] inline-flex items-center px-2 bg-slate-800 rounded text-slate-400 font-mono whitespace-nowrap">${timeStr}</span>`;
      lastUpdateEl.classList.remove('hidden');

      // Warning if data is older than 8 minutes (should be 5 min)
      const warningEl = document.getElementById('errorMsg');
      if (diffMin >= 8) {
        warningEl.textContent = `⚠️ Hinweis: Die Daten sind bereits ${diffMin} Minuten alt. Möglicherweise verzögert sich die Aktualisierung.`;
        warningEl.classList.remove('hidden');
      } else if (!lastFetchedData.error) {
        warningEl.classList.add('hidden');
      }
    }

    function renderDashboard(data) {
      lastFetchedData = data;

      // Overall status (now inline in header)
      const overall = data.overall ?? 'unknown';
      const inlineEl = document.getElementById('overallInline');
      if (inlineEl) inlineEl.classList.remove('hidden');
      applyLevel(document.getElementById('overallDot'), overall, 'dot');
      applyLevel(document.getElementById('overallBadge'), overall, 'badge');
      document.getElementById('overallText').textContent = LEVEL_TEXT[overall] ?? overall;
      document.getElementById('overallBadge').textContent = LEVEL_LABEL[overall] ?? overall;

      // Hazard cards
      const grid = document.getElementById('hazardGrid');
      const severityRank = { red: 3, yellow: 2, green: 1, unknown: 0 };

      const PRIORITY_ORDER = [
        'blackout', 'power', 'traffic', 'space', 'radiation', 'earthquake', 'atAlert', 'pandemic', 'pressure',
        'uwz', 'heat', 'fire', 'rain', 'wind', 'thunderstorm',
        'weatherWidget', 'flood', 'winter', 'airQuality'
      ];

      const sortedHazards = Object.entries(LABELS)
        .map(([key, label]) => ({ key, label, data: data.hazards?.[key] }))
        .sort((a, b) => {
          const rankA = severityRank[a.data?.level] ?? 0;
          const rankB = severityRank[b.data?.level] ?? 0;
          if (rankA !== rankB) return rankB - rankA;

          // Priority sort by custom order
          const pA = PRIORITY_ORDER.indexOf(a.key);
          const pB = PRIORITY_ORDER.indexOf(b.key);
          return pA - pB;
        });

      grid.innerHTML = sortedHazards
        .map(({ key, data: hazardData }) => renderHazardCard(key, hazardData))
        .join('');

      // Error handling
      const errEl = document.getElementById('errorMsg');
      if (data.error) {
        errEl.textContent = `⚠️ Fehler beim letzten Datenabruf: ${data.error}`;
        errEl.classList.remove('hidden');
      } else {
        errEl.classList.add('hidden');
      }

      updateRelativeTime();
    }

    async function loadStatus() {
      if (isFetching && lastFetchedData) return;
      isFetching = true;

      const lastUpdateEl = document.getElementById('lastUpdate');
      lastUpdateEl.classList.add('animate-pulse');

      try {
        // Primary: Netlify Function (live data from APIs)
        let data;
        try {
          const res = await fetch('/.netlify/functions/refresh', { cache: 'no-store' });
          if (!res.ok) throw new Error(`Function HTTP ${res.status}`);
          data = await res.json();
          console.log('Live data loaded:', data);
        } catch (fnErr) {
          // Fallback: static file (last known good from GitHub Actions)
          console.warn('Live fetch failed, falling back to static file:', fnErr.message);
          const cb = `${Date.now()}-${Math.random().toString(36).substring(7)}`;
          const res = await fetch(`./alert_status.json?cb=${cb}`, { cache: 'no-store' });
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          data = await res.json();
        }

        // Cache the successful data in localStorage
        try {
          localStorage.setItem('schuettel_disaster_data', JSON.stringify(data));
        } catch (storageErr) {
          console.warn('Could not save data to localStorage:', storageErr);
        }

        renderDashboard(data);
      } catch (err) {
        console.error('Dashboard load error:', err);
        
        // Attempt to load from localStorage cache
        let cachedData = null;
        try {
          const cachedStr = localStorage.getItem('schuettel_disaster_data');
          if (cachedStr) {
            cachedData = JSON.parse(cachedStr);
          }
        } catch (storageErr) {
          console.warn('Could not load data from localStorage:', storageErr);
        }

        const errEl = document.getElementById('errorMsg');
        if (cachedData) {
          renderDashboard(cachedData);
          const d = new Date(cachedData.fetchedAt);
          const exactTime = d.toLocaleTimeString('de-AT', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
          errEl.textContent = `⚠️ Offline-Modus: Aktuelle Daten konnten nicht geladen werden. Anzeige der letzten bekannten Daten von ${exactTime}.`;
          errEl.classList.remove('hidden');
        } else {
          errEl.textContent = `Verbindungsfehler: ${err.message}`;
          errEl.classList.remove('hidden');
        }
      } finally {
        isFetching = false;
        lastUpdateEl.classList.remove('animate-pulse');
      }
    }

    // ── Live Clock ────────────────────────────────────────────────────
    function updateClock() {
      const now = new Date();
      const weekday = now.toLocaleDateString('de-AT', { weekday: 'long' });
      const day    = String(now.getDate()).padStart(2, '0');
      const month  = String(now.getMonth() + 1).padStart(2, '0');
      const year   = now.getFullYear();
      const hh     = String(now.getHours()).padStart(2, '0');
      const mm     = String(now.getMinutes()).padStart(2, '0');
      const ss     = String(now.getSeconds()).padStart(2, '0');
      const el = document.getElementById('liveClock');
      if (el) el.textContent = `${weekday}, ${day}.${month}.${year}, ${hh}:${mm}:${ss}`;
    }
    updateClock();
    setInterval(updateClock, 1000);

    // ── Live Frequency Updater (Blackout-Karte) ──────────────────────────
    const LEVEL_LABELS_FREQ = { green: 'SICHER', yellow: 'WARNUNG', red: 'ALARM' };

    async function updateLiveFrequency() {
      try {
        const res = await fetch('/.netlify/functions/frequency', { cache: 'no-store' });
        if (!res.ok) return;
        const { hz, level } = await res.json();
        if (typeof hz !== 'number') return;

        const valEl = document.getElementById('blackout-hz-value');
        const badgeEl = document.getElementById('blackout-badge');
        const cardEl = document.getElementById('blackout-card');

        if (valEl) valEl.textContent = `${hz.toFixed(3)} Hz`;

        if (badgeEl && level) {
          badgeEl.className = `badge-${level} shrink-0 px-2.5 py-1 rounded-full border text-xs font-bold transition-colors duration-500`;
          badgeEl.textContent = LEVEL_LABELS_FREQ[level] ?? level.toUpperCase();
        }

        if (cardEl && level) {
          cardEl.className = cardEl.className.replace(/card-glow-\w+/, `card-glow-${level}`);
        }

        // Dynamically update the curve path if history is present
        if (lastFetchedData?.hazards?.blackout?.history?.length > 1) {
          const hist = lastFetchedData.hazards.blackout.history;
          hist[hist.length - 1] = hz; // update the current value in history

          const minVal = Math.min(...hist);
          const maxVal = Math.max(...hist);
          let range = maxVal - minVal;
          let adjustedMin = minVal;
          if (range < 0.05) {
            range = 0.05;
            const center = (minVal + maxVal) / 2;
            adjustedMin = center - 0.025;
          }
          const points = hist.map((val, i) => {
            const x = (i / (hist.length - 1)) * 300;
            const y = 35 - ((val - adjustedMin) / range) * 22;
            return `${x.toFixed(1)},${y.toFixed(1)}`;
          });
          const pathD = `M ${points.join(' L ')}`;
          const gradD = `${pathD} L 300,40 L 0,40 Z`;

          const pathEl = document.getElementById('blackout-curve-path');
          const gradEl = document.getElementById('blackout-curve-grad');
          if (pathEl) pathEl.setAttribute('d', pathD);
          if (gradEl) gradEl.setAttribute('d', gradD);
        }
      } catch {
        // Silently ignore – next interval will retry
      }
    }

    // Initialize
    loadStatus();

    // Aggressive polling: Every 60 seconds (down from 5 min)
    setInterval(loadStatus, 60 * 1000);

    // Live-Frequenz: alle 5 Sekunden aktualisieren (nach erstem Render)
    setTimeout(() => {
      updateLiveFrequency();
      setInterval(updateLiveFrequency, 5000);
    }, 2000);

    // Relative time update: Every 5 seconds
    setInterval(updateRelativeTime, 5000);

    // Visibility listener: Refresh immediately when tab becomes active
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') {
        loadStatus();
      }
    });

    // ── PWA & Installation ───────────────────────────────────────────
    let deferredPrompt;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      document.getElementById('installBtn').classList.remove('hidden');
    });

    document.getElementById('installBtn').addEventListener('click', async () => {
      if (!deferredPrompt) return;
      deferredPrompt.prompt();
      const { outcome } = await deferredPrompt.userChoice;
      if (outcome === 'accepted') {
        document.getElementById('installBtn').classList.add('hidden');
      }
      deferredPrompt = null;
    });

    window.addEventListener('appinstalled', () => {
      document.getElementById('installBtn').classList.add('hidden');
      deferredPrompt = null;
    });

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js?v=38').then(reg => {
          // Check for updates every 15 minutes
          setInterval(() => {
            reg.update();
          }, 15 * 60 * 1000);

          reg.onupdatefound = () => {
            const newSW = reg.installing;
            newSW.onstatechange = () => {
              if (newSW.state === 'installed' && navigator.serviceWorker.controller) {
                // Controller change listener below handles the reload
              }
            };
          };
        }).catch(err => console.warn('SW registration failed:', err));
      });

      // Reload when the new Service Worker takes control
      let refreshing = false;
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (refreshing) return;
        refreshing = true;
        window.location.reload();
      });
    }

    // Weather widget tab interaction
    document.getElementById('hazardGrid').addEventListener('click', (e) => {
      if (e.target.matches('.weather-tab')) {
        const type = e.target.dataset.chart;
        document.querySelectorAll('.weather-tab').forEach(btn => {
          btn.classList.remove('text-yellow-400', 'text-slate-100', 'border-yellow-400');
          btn.classList.add('text-slate-400', 'border-transparent');
          if (btn.dataset.chart === type) {
            btn.classList.add('text-yellow-400', 'border-yellow-400');
            btn.classList.remove('text-slate-400', 'border-transparent');
          }
        });
        document.querySelectorAll('.wchart').forEach(el => { el.style.display = 'none'; });
        document.querySelectorAll('.wlabels').forEach(el => { el.style.display = 'none'; });
        const svg = document.getElementById('wchart-' + type);
        const lbl = document.getElementById('wlabels-' + type);
        if (svg) svg.style.display = '';
        if (lbl) lbl.style.display = '';
      }
    });
  </script>
</body>
