name: Update Disaster Alert Data

on:
  schedule:
    - cron: '1,6,11,16,21,26,31,36,41,46,51,56 * * * *'   # every 5 minutes, slightly offset
  workflow_dispatch:           # allow manual trigger
    inputs:
      force_test_email:
        description: 'Erzwinge das Senden einer Test-E-Mail (auch ohne neue Warnungen)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  fetch-and-push:
    name: Fetch Data & Push JSON
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Backup old alert status
        run: |
          cp public/alert_status.json public/alert_status_old.json || echo "{}" > public/alert_status_old.json

      - name: Fetch alert data
        run: node fetchData.js

      - name: Check for new alerts
        id: check-alerts
        env:
          FORCE_TEST_EMAIL: ${{ github.event.inputs.force_test_email }}
        run: node scripts/checkAlerts.js

      - name: Send Alert Email
        if: steps.check-alerts.outputs.send_email == 'true'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: ${{ steps.check-alerts.outputs.subject }}
          to: ${{ secrets.RECEIVER_EMAIL }}
          from: "Disaster Guardian <${{ secrets.MAIL_USERNAME }}>"
          html_body: file://email_alert.html

      - name: Commit & push if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/alert_status.json
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          git diff --staged --quiet || git commit -m "data: update alert_status.json at $TIMESTAMP [skip ci]"
          git push
