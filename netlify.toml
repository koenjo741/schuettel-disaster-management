# Netlify configuration for Schüttelstraße Disaster Management Dashboard

[build]
  publish = "public"

# Prevent CDN from caching the live data file
[[headers]]
  for = "/alert_status.json"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Pragma        = "no-cache"
    Expires       = "0"

# Static assets (HTML, CSS, JS) can be cached briefly
[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=300, stale-while-revalidate=60"
